services:
  php:
    build: docker/php
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: atar_test
      DB_USERNAME: atar
      DB_PASSWORD: atar
      PHP_CS_FIXER_IGNORE_ENV: "1"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: atar_test
      MARIADB_USER: atar
      MARIADB_PASSWORD: atar
      MARIADB_ROOT_PASSWORD: root
    # Test data only (tmpfs): no flushing to disk on commit; connections for every parallel test worker.
    command: ["--max-connections=1000", "--innodb-flush-log-at-trx-commit=0", "--innodb-doublewrite=0", "--skip-log-bin"]
    volumes:
      - ./docker/mariadb/test-databases.sql:/docker-entrypoint-initdb.d/test-databases.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
