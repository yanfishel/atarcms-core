; Production PHP settings for AtarCMS. Loaded after php.ini (zz-atar.ini) when the image is built with
; --build-arg ATAR_PRODUCTION=1; see README.md, "Production".

; OPcache checks a file for changes at most every two seconds, so a deploy needs no PHP-FPM reload.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
