; A PHP-FPM pool for one AtarCMS site on a server without Docker. One user owns the site and runs this pool,
; composer and bin/atar ("sudo -u <site user> php bin/atar ..."); the web server only connects to the socket.
; Debian/Ubuntu: copy to /etc/php/8.4/fpm/pool.d/<site>.conf, replace "example" with the site user, then
;   systemctl reload php8.4-fpm
[atarcms-example]
user = example
group = example
listen = /run/php/atarcms-example.sock
; nginx and Apache run as www-data on Debian/Ubuntu; Debian's Caddy runs as caddy: add it to the group
; (usermod -aG www-data caddy) or change these two.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Limits the media library needs (config/media.php: max_size 10 MB, max_video_size 100 MB, max_pixels 25 MP).
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 101M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off

; OPcache checks changed files at most every two seconds: a deploy needs no reload (docker/php/production.ini).
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
