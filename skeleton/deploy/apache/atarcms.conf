# AtarCMS behind Apache 2.4 and PHP-FPM; the same rules as deploy/nginx/atarcms.conf.template.
# Debian/Ubuntu: copy to /etc/apache2/sites-available/<site>.conf, set the three Defines, then
#   a2enmod rewrite headers proxy_fcgi alias deflate && a2ensite <site> && apachectl configtest && systemctl reload apache2
#   certbot --apache -d example.com    (adds the HTTPS virtual host)
# Do not enable the global php8.4-fpm conf (a2disconf php8.4-fpm): it would run every .php file; here only
# public/index.php runs. .env, storage/, vendor/ and config/ are outside the document root.
Define ATAR_SITE_ROOT /var/www/example
Define ATAR_THEME default
Define ATAR_FPM_SOCKET /run/php/atarcms-example.sock

<VirtualHost *:80>
    ServerName example.com
    DocumentRoot ${ATAR_SITE_ROOT}/public
    ServerSignature Off
    # Keep above media.max_size and media.max_video_size (config/media.php): 101 MB.
    LimitRequestBody 105906176

    <Directory ${ATAR_SITE_ROOT}/public>
        Options -Indexes +FollowSymLinks
        # public/.htaccess sends every path that is not a file to index.php.
        AllowOverride All
        Require all granted
        <Files "index.php">
            SetHandler "proxy:unix:${ATAR_FPM_SOCKET}|fcgi://localhost"
        </Files>
    </Directory>

    # Compressed text responses; images, video and woff2 are compressed already and stay out of the list (Apache
    # never compresses a byte range either). The admin is left out (BREACH: its pages carry the session's CSRF token
    # next to input they reflect, such as a search); THE_REQUEST survives the rewrite to index.php, the URL does not.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml text/xml application/rss+xml application/atom+xml text/plain text/markdown
        <If "%{THE_REQUEST} =~ m#^\S+ /admin(/|\?|\s)#">
            SetEnv no-gzip 1
        </If>
    </IfModule>

    # Hidden files below the static prefixes, and PHP sources in the asset directories, answer 404 like nginx.
    RedirectMatch 404 "^/(theme-assets|admin-assets|uploads|media)/(.*/)?\."
    RedirectMatch 404 "^/(theme-assets|admin-assets|uploads|media)/.*\.(php|phar|phtml)$"

    # Keep these headers in sync with AssetFileController::CACHE (the PHP fallback of both asset prefixes).
    Alias /theme-assets ${ATAR_SITE_ROOT}/themes/${ATAR_THEME}/assets
    <Directory ${ATAR_SITE_ROOT}/themes/${ATAR_THEME}/assets>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    Alias /admin-assets ${ATAR_SITE_ROOT}/vendor/yanfishel/atarcms-core/resources/admin/assets
    <Directory ${ATAR_SITE_ROOT}/vendor/yanfishel/atarcms-core/resources/admin/assets>
        Options -Indexes
        AllowOverride None
        Require all granted
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # Uploaded originals: static files only, never PHP, sandboxed; PDFs are downloads, videos play inline (Apache
    # answers Range requests itself, as the PHP fallback does). Keep the headers in sync with
    # MediaFileController::CACHE and ::SANDBOX.
    Alias /uploads ${ATAR_SITE_ROOT}/storage/uploads
    <Directory ${ATAR_SITE_ROOT}/storage/uploads>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        SetHandler none
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; sandbox"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        <FilesMatch "\.pdf$">
            Header always set Content-Disposition "attachment"
        </FilesMatch>
        <FilesMatch "^\.|\.(php|phar|phtml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Image variants: the cached file once generated; the first request of each goes to PHP, which makes it.
    Alias /media ${ATAR_SITE_ROOT}/storage/cache/media
    <Directory ${ATAR_SITE_ROOT}/storage/cache/media>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        SetHandler none
        FallbackResource /index.php
        # AVIF variants (ImageFormats): older mime.types files lack the type.
        AddType image/avif .avif
        Header always set Cache-Control "public, max-age=31536000, immutable"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; sandbox"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
